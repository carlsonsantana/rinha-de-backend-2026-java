services:
  lb:
    build:
      context: ./lb
    environment:
      PORT: "9999"
      UPSTREAMS: /run/sockets/api1.sock,/run/sockets/api2.sock
    ports:
      - "9999:9999"
    volumes:
      - sockets:/run/sockets
    cpuset: "2,3"
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: "30MB"

  api1:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      LB_SOCK: /run/sockets/api1.sock
      INDEX_FILE: /data/index.bin
    volumes:
      - sockets:/run/sockets
    cpuset: "0"
    depends_on:
      lb:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.425"
          memory: "160MB"

  api2:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      LB_SOCK: /run/sockets/api2.sock
      INDEX_FILE: /data/index.bin
    volumes:
      - sockets:/run/sockets
    cpuset: "1"
    depends_on:
      lb:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.425"
          memory: "160MB"

volumes:
  sockets:
